# Open-source threat-intel feeds pulled by update_threatlist.sh
# Format:  <type>|<url>
#   type = ip      -> one IP/CIDR per line (or first whitespace-delimited token per line)
#          domain  -> one FQDN per line
#          csv_ip  -> CSV; we extract IPs that look like IPs anywhere in each row
#          urlhaus -> abuse.ch URLhaus text feed (URLs → host extracted)
# Lines starting with '#' are ignored.
# All sources here are public, no API key required. Update freely.

# --- abuse.ch (no auth) ---
ip|https://feodotracker.abuse.ch/downloads/ipblocklist.txt
csv_ip|https://threatfox.abuse.ch/export/csv/ip-port/recent/
csv_ip|https://sslbl.abuse.ch/blacklist/sslipblacklist.csv
urlhaus|https://urlhaus.abuse.ch/downloads/text_recent/

# --- FireHOL Level 1 (high-confidence, widely-vetted) ---
ip|https://iplists.firehol.org/files/firehol_level1.netset

# --- Emerging Threats compromised hosts ---
ip|https://rules.emergingthreats.net/blockrules/compromised-ips.txt

# --- CINS Army (army.deepviz.com) high-confidence ---
ip|https://cinsscore.com/list/ci-badguys.txt

# --- OpenPhish community feed (URLs → host extracted) ---
urlhaus|https://openphish.com/feed.txt

# --- Spamhaus DROP / EDROP (CIDR ranges) ---
ip|https://www.spamhaus.org/drop/drop.txt
ip|https://www.spamhaus.org/drop/edrop.txt

# --- Add your own feeds below ---
# ip|https://example.com/my-iocs.txt
# domain|https://example.com/my-domains.txt
